<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JALAN SEHAT SMA</title>
<style>
body{margin:0;background:#1e5eff;font-family:sans-serif;text-align:center;color:white}
.box{background:white;color:#1e5eff;border-radius:20px;padding:20px;margin:20px;max-width:350px;margin:20px auto}
button{width:100%;padding:20px;font-size:20px;font-weight:900;border-radius:15px;border:3px solid #1e5eff;background:#00ff88;margin:10px 0;cursor:pointer}
#game{display:none;background:linear-gradient(#87CEEB,#7CFF7C);height:100vh;position:relative;overflow:hidden}
#player{position:absolute;bottom:80px;left:50%;font-size:60px;transform:translateX(-50%)}
.obj{position:absolute;top:0;font-size:40px}
</style>
</head>
<body>
<div id="menu">
<h1 style="margin-top:60px">🚶‍♂️ JALAN SEHAT<br>SMA</h1>
<div class="box">
<h2>VERSI SMA</h2>
<p>Anti Gagal Klik!</p>
<button onclick="mulai()">▶️ KLIK DISINI UNTUK JALAN</button>
<button onclick="alert('test klik ok')">TEST KLIK</button>
</div>
</div>
<div id="game">
<div style="background:black;color:white;padding:10px;display:flex;justify-content:space-between">
<button onclick="kembali()" style="width:auto;padding:10px 20px;font-size:14px;background:gold">🏠 MENU</button>
<div>💧 <span id="skor">0</span></div>
<button onclick="kembali()" style="width:auto;padding:10px;background:white">✖️</button>
</div>
<div id="player">🚶‍♂️</div>
<div style="position:fixed;bottom:0;width:100%;display:flex;gap:10px;padding:10px;background:rgba(0,0,0,.5)">
<button style="flex:1" ontouchstart="kiri()" ontouchend="stop()" onmousedown="kiri()" onmouseup="stop()">◀</button>
<button style="flex:1" ontouchstart="kanan()" ontouchend="stop()" onmousedown="kanan()" onmouseup="stop()">▶</button>
</div>
</div>
<script>
let s=0,x=50,d=0,run=false,objs=[];
function mulai(){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';run=true;loop();}
function kembali(){run=false;document.getElementById('game').style.display='none';document.getElementById('menu').style.display='block';}
function kiri(){d=-5}function kanan(){d=5}function stop(){d=0}
function loop(){
 if(!run)return;
 x+=d*0.8;if(x<10)x=10;if(x>90)x=90;document.getElementById('player').style.left=x+'%';
 if(Math.random()<0.05){let e=document.createElement('div');e.className='obj';e.innerText=Math.random()<0.7?'💧':'🕳️';e.style.left=(Math.random()*80+10)+'%';e.style.top='0px';e.dataset.t=e.innerText=='💧'?'good':'bad';document.getElementById('game').appendChild(e);objs.push(e);}
 objs.forEach((o,i)=>{let y=parseFloat(o.style.top);y+=5;o.style.top=y+'px';if(y>600){o.remove();objs.splice(i,1);return;}let ox=parseFloat(o.style.left);if(y>400&&y<500&&Math.abs(ox-x)<10){if(o.dataset.t=='good'){s++;document.getElementById('skor').innerText=s;}o.remove();objs.splice(i,1);}});
 requestAnimationFrame(loop);
}
</script>
</body>
</html>
