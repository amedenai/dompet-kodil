<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#1e5eff;font-family:sans-serif;overflow:hidden}
#game{background:linear-gradient(#87CEEB 0%,#a0e0ff 25%,#7CFF7C 25.5%);height:100vh;position:relative}
#player{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:75px;z-index:50;background:rgba(255,255,255,.9);border-radius:50%;width:85px;height:85px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,.4);border:3px solid white}
.obj{position:absolute;font-size:48px;z-index:10}
.top{position:absolute;top:0;left:0;right:0;background:black;color:white;padding:10px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.controls{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;padding:10px;background:rgba(0,0,0,.4);z-index:100}
.controls button{flex:1;padding:22px;font-size:28px;background:#00ff88;border-radius:18px;border:3px solid white;font-weight:900}
</style></head><body>
<div id="game">
<div class="top">
<button onclick="location.href='jalan.html'" style="background:gold;padding:10px 18px;border-radius:12px;font-weight:900;border:2px solid white">🏠 MENU</button>
<div>💧 <span id="skor">0</span> M: <span id="meter">0</span></div>
<button onclick="location.reload()" style="background:white;padding:10px 14px;border-radius:12px;font-weight:900">✖️</button>
</div>
<div id="player">🚶</div>
<div class="controls">
<button ontouchstart="kiri=1" ontouchend="kiri=0" onmousedown="kiri=1" onmouseup="kiri=0">◀</button>
<button ontouchstart="kanan=1" ontouchend="kanan=0" onmousedown="kanan=1" onmouseup="kanan=0">▶</button>
</div>
</div>
<script>
let s=0,m=0,x=50,kiri=0,kanan=0,objs=[],run=true;
const p=document.getElementById('player');
function loop(){
if(!run)return;
if(kiri)x-=4;if(kanan)x+=4;if(x<8)x=8;if(x>92)x=92;p.style.left=x+'%';
m+=0.2;document.getElementById('meter').innerText=Math.floor(m);
if(Math.random()<0.04){let e=document.createElement('div');e.className='obj';e.innerText=Math.random()<0.6?'💧':'🕳️';e.style.left=(Math.random()*80+10)+'%';e.style.top='60px';e.dataset.t=e.innerText=='💧'?'good':'bad';document.getElementById('game').appendChild(e);objs.push(e);}
objs.forEach((o,i)=>{let y=parseFloat(o.style.top);y+=4;o.style.top=y+'px';if(y>700){o.remove();objs.splice(i,1);return;}let ox=parseFloat(o.style.left);if(y>480&&y<580&&Math.abs(ox-x)<12){if(o.dataset.t=='good'){s++;document.getElementById('skor').innerText=s;p.innerText='😋';setTimeout(()=>p.innerText='🚶',300);}else{p.innerText='🤕';setTimeout(()=>p.innerText='🚶',400);}o.remove();objs.splice(i,1);}});
requestAnimationFrame(loop);
}loop();
</script>
</body></html>
