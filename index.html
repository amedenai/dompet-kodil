<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dompet Kodil - DANA</title>
<style>
  body { margin:0; font-family:sans-serif; background:#f0f4f8; }
  .header { background:#118EEA; color:white; padding:20px; border-radius:0 0 20px 20px; }
  .saldo-box { background:white; color:black; padding:15px; border-radius:12px; margin-top:15px; display:flex; justify-content:space-between; align-items:center; }
  .saldo { font-size:22px; font-weight:bold; }
  .menu { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; padding:20px; }
  .menu div { background:white; padding:15px 5px; text-align:center; border-radius:12px; box-shadow:0 2px 5px rgba(0,0,0,0.1); cursor:pointer; }
  .menu div:active { transform:scale(0.9); }
  .riwayat { background:white; margin:0 20px; padding:15px; border-radius:12px; }
  .item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; }
  .popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
  .popup-content { background:white; padding:20px; border-radius:12px; width:80%; max-width:300px; text-align:center; }
  .btn { background:#118EEA; color:white; border:none; padding:10px 20px; border-radius:8px; margin-top:10px; width:100%; }
</style>
</head>
<body>

<div class="header">
  <div>Hai, Tuan Kodil 👋</div>
  <div style="font-size:28px; margin-top:10px;">🐱</div>
  <div class="saldo-box">
    <div>
      <div style="font-size:12px; color:gray;">Saldo Dompet Kodil</div>
      <div class="saldo" id="saldo">Rp 275.000</div>
    </div>
    <div style="color:#118EEA; font-weight:bold; cursor:pointer;" onclick="topup()">+ Top Up</div>
  </div>
</div>

<div class="menu">
  <div onclick="aksi('Kirim')">📤<br>Kirim</div>
  <div onclick="aksi('Minta')">📥<br>Minta</div>
  <div onclick="aksi('Bayar')">🛒<br>Bayar</div>
  <div onclick="topup()">💰<br>Top Up</div>
  <div onclick="aksi('Pulsa')">📱<br>Pulsa</div>
  <div onclick="aksi('Listrik')">💡<br>Listrik</div>
  <div onclick="aksi('BPJS')">🏥<br>BPJS</div>
  <div onclick="aksi('Lainnya')">⋯<br>Lainnya</div>
</div>

<div class="riwayat">
  <b>Riwayat Transaksi</b>
  <div class="item" onclick="aksi('Detail DORTMUND')">
    <span>⚽ DORTMUND 75%</span><span style="color:green;">Berhasil</span>
  </div>
  <div class="item" onclick="aksi('Detail Top Up')">
    <span>💰 Top Up 100rb</span><span style="color:green;">+ Rp 100.000</span>
  </div>
  <div class="item" onclick="aksi('Detail Bayar')">
    <span>🛒 Bayar Warung</span><span style="color:red;">- Rp 25.000</span>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h3 id="popup-judul">Fitur</h3>
    <p id="popup-isi">Ini fitur bisa di klik Tuan!</p>
    <input type="number" id="inputNominal" placeholder="Masukkan nominal" style="width:100%; padding:10px; display:none; margin-top:10px; border-radius:8px; border:1px solid #ddd;">
    <button class="btn" onclick="tutupPopup()">Tutup</button>
    <button class="btn" id="btnProses" onclick="proses()" style="display:none; background:green;">Proses</button>
  </div>
</div>

<script>
let saldoAwal = 275000;
let fiturAktif = '';

function formatRupiah(angka){
  return 'Rp ' + angka.toLocaleString('id-ID');
}

function aksi(nama){
  fiturAktif = nama;
  document.getElementById('popup-judul').innerText = nama;
  document.getElementById('popup-isi').innerText = 'Kamu klik ' + nama + ' Tuan! Fitur ini aktif.';
  document.getElementById('inputNominal').style.display = 'none';
  document.getElementById('btnProses').style.display = 'none';
  document.getElementById('popup').style.display = 'flex';
}

function topup(){
  fiturAktif = 'Top Up';
  document.getElementById('popup-judul').innerText = 'Top Up Saldo';
  document.getElementById('popup-isi').innerText = 'Mau top up berapa Tuan?';
  document.getElementById('inputNominal').style.display = 'block';
  document.getElementById('btnProses').style.display = 'block';
  document.getElementById('popup').style.display = 'flex';
}

function proses(){
  let nominal = parseInt(document.getElementById('inputNominal').value);
  if(!nominal){ alert('Masukkan nominal dulu Tuan!'); return; }
  if(fiturAktif === 'Top Up'){
    saldoAwal += nominal;
  } else {
    saldoAwal -= nominal;
  }
  document.getElementById('saldo').innerText = formatRupiah(saldoAwal);
  tutupPopup();
  alert('Berhasil! Saldo baru: ' + formatRupiah(saldoAwal));
}

function tutupPopup(){
  document.getElementById('popup').style.display = 'none';
  document.getElementById('inputNominal').value = '';
}
</script>

</body>
</html>
