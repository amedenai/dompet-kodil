<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dompet Kodil V2</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f0f2f5;display:flex;justify-content:center}.phone{width:100%;max-width:400px;background:#fff;min-height:100vh;position:relative;padding-bottom:80px}.header{background:linear-gradient(135deg,#118EEA,#0A6FC2);padding:22px 20px 25px;color:#fff;border-radius:0 0 28px 28px}.top{font-weight:900;font-size:18px;display:flex;justify-content:space-between}.saldo{font-size:32px;font-weight:900;margin-top:4px}.menus{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 16px}.m-item{text-align:center;cursor:pointer}.m-icon{width:56px;height:56px;background:#E8F3FF;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:end;justify-content:center;z-index:99}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:400px;border-radius:22px 22px 0 0;padding:20px}.btn{width:100%;padding:14px;background:#118EEA;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:12px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px}.tx{border:1px solid #eee;border-radius:14px;padding:12px;display:flex;justify-content:space-between;margin:10px 16px}</style></head><body><div class="phone"><div class="header"><div class="top"><span>Dompet Kodil</span><span>🔔</span></div><div style="margin-top:18px;opacity:.85;font-size:13px">Saldo Kamu</div><div class="saldo" id="saldoTxt">Rp 275.000</div></div><div class="menus"><div class="m-item" onclick="openMenu('Kirim')"><div class="m-icon">📤</div><p>Kirim</p></div><div class="m-item" onclick="openMenu('Minta')"><div class="m-icon">📥</div><p>Minta</p></div><div class="m-item" onclick="openMenu('Bayar')"><div class="m-icon">🛒</div><p>Bayar</p></div><div class="m-item" onclick="openMenu('Top Up')"><div class="m-icon">💳</div><p>Top Up</p></div></div><div id="txList"><div class="tx">DORTMUND 75% - Bonus Menang +Rp 75.000</div><div class="tx">Indomaret -Rp 42.500</div></div></div><div class="modal" id="modal" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()"><h3 id="modalTitle">Menu</h3><p style="font-size:13px;color:#666">Masukkan nominal, saldo akan otomatis berubah!</p><input id="inputJumlah" type="number" placeholder="Masukkan jumlah Rp"><button class="btn" onclick="proses()">Proses Sekarang</button><button style="width:100%;padding:12px;background:#eee;border:none;border-radius:12px;margin-top:8px" onclick="closeModal()">Tutup</button></div></div><script>let saldo=275000;function openMenu(n){document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').innerText=n}function closeModal(){document.getElementById('modal').classList.remove('show')}function proses(){let j=parseInt(document.getElementById('inputJumlah').value||0);if(j<=0){alert('Masukkan jumlah!');return}let title=document.getElementById('modalTitle').innerText;if(title==='Kirim'||title==='Bayar')saldo-=j;else saldo+=j;document.getElementById('saldoTxt').innerText='Rp '+saldo.toLocaleString('id-ID');let list=document.getElementById('txList');let d=document.createElement('div');d.className='tx';d.innerText=title+' Rp '+j.toLocaleString('id-ID')+' - Berhasil';list.prepend(d);closeModal();alert('Berhasil Tuan!')}</script></body></html>￼Enter
