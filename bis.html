<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUS 3D FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100vh}
#ui{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:10}
.badge{background:rgba(0,0,0,.85);color:white;border:2px solid white;border-radius:14px;padding:8px 12px;font-weight:900;font-size:12px}
#ctrl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#1e3a8a,#0f172a);border-top:4px solid white;border-radius:24px 24px 0 0;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;z-index:10;max-width:500px;margin:0 auto}
#ctrl button{padding:18px;border-radius:16px;border:3px solid white;font-weight:900;font-size:14px;box-shadow:0 4px 0 black}
#ctrl button:active{transform:translateY(3px);box-shadow:0 1px 0 black}
#gas{grid-column:span 3;background:#84cc16;font-size:18px;padding:16px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
<div class="badge" style="background:#fbbf24;color:black">☰ MENU</div>
<div class="badge">👤 <span id="p">0</span>/20</div>
<div class="badge">💰 $<span id="m">0</span></div>
<div class="badge">💨 <span id="s">0</span> KM/H</div>
</div>
<div id="ctrl">
<button style="background:#38bdf8" ontouchstart="left=1" ontouchend="left=0" onmousedown="left=1" onmouseup="left=0">◀ BELOK</button>
<button style="background:#ef4444;color:white" ontouchstart="brake=1" ontouchend="brake=0" onmousedown="brake=1" onmouseup="brake=0">⏸️ REM</button>
<button style="background:#38bdf8" ontouchstart="right=1" ontouchend="right=0" onmousedown="right=1" onmouseup="right=0">BELOK ▶</button>
<button id="gas" ontouchstart="gas=1" ontouchend="gas=0" onmousedown="gas=1" onmouseup="gas=0">💨 GAS POLL TAHAN!</button>
</div>
<script>
let canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth*2; canvas.height=innerHeight*2; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';}
resize(); addEventListener('resize',resize);

let speed=0, x=0, left=0,right=0,gas=0,brake=0, km=0, pass=0, money=0, roadY=0;
let halteZ=200, halteX=120;

function drawRoad(){
 let w=canvas.width, h=canvas.height;
 // sky
 let g=ctx.createLinearGradient(0,0,0,h*0.45); g.addColorStop(0,'#87CEEB'); g.addColorStop(1,'#e0f2fe'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h*0.45);
 // road perspective
 ctx.fillStyle='#334155'; ctx.beginPath(); ctx.moveTo(w*0.5-30,h*0.45); ctx.lineTo(w*0.5+30,h*0.45); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
 // side grass
 ctx.fillStyle='#4ade80'; ctx.fillRect(0,h*0.45,w*0.15,h*0.55); ctx.fillRect(w*0.85,h*0.45,w*0.15,h*0.55);
 // road lines
 ctx.strokeStyle='white'; ctx.lineWidth=8; ctx.setLineDash([60,60]); ctx.lineDashOffset=-roadY; ctx.beginPath(); ctx.moveTo(w*0.5,h*0.45); ctx.lineTo(w*0.5,h); ctx.stroke(); ctx.setLineDash([]);
 // yellow border
 ctx.strokeStyle='#fbbf24'; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(w*0.15,h*0.45); ctx.lineTo(0,h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w*0.85,h*0.45); ctx.lineTo(w,h); ctx.stroke();
}

function drawBus(){
 let w=canvas.width, h=canvas.height;
 let busW=280, busH=220, bx=w*0.5 + x*3 - busW/2, by=h-420;
 // shadow
 ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(bx+busW/2, by+busH+20, busW/2, 20, 0,0,Math.PI*2); ctx.fill();
 // body
 ctx.fillStyle='#facc15'; ctx.strokeStyle='black'; ctx.lineWidth=8; ctx.beginPath(); ctx.roundRect(bx,by,busW,busH,28); ctx.fill(); ctx.stroke();
 // roof
 ctx.fillStyle='#fde047'; ctx.beginPath(); ctx.roundRect(bx+10,by+10,busW-20,50,14); ctx.fill(); ctx.stroke();
 // windshield
 ctx.fillStyle='#38bdf8'; ctx.strokeStyle='black'; ctx.lineWidth=4; ctx.beginPath(); ctx.roundRect(bx+20,by+70,busW-40,60,12); ctx.fill(); ctx.stroke();
 ctx.fillStyle='white'; ctx.fillRect(bx+30,by+80,60,8); // reflection
 // windows
 ctx.fillStyle='#1e293b'; for(let i=0;i<3;i++){ctx.beginPath(); ctx.roundRect(bx+20+i*80,by+150,60,40,8); ctx.fill();}
 // wheels
 ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(bx+60,by+busH-10,32,0,Math.PI*2); ctx.arc(bx+busW-60,by+busH-10,32,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='#666'; ctx.beginPath(); ctx.arc(bx+60,by+busH-10,16,0,Math.PI*2); ctx.arc(bx+busW-60,by+busH-10,16,0,Math.PI*2); ctx.fill();
 // lights
 ctx.fillStyle='#fef08a'; ctx.beginPath(); ctx.arc(bx+40,by+busH-30,14,0,Math.PI*2); ctx.arc(bx+busW-40,by+busH-30,14,0,Math.PI*2); ctx.fill();
 // number
 ctx.fillStyle='black'; ctx.font='bold 28px sans-serif'; ctx.fillText('BUS 08', bx+busW/2-50, by+40);
}

function drawHalte(){
 let w=canvas.width, h=canvas.height;
 let scale = 200 / halteZ; if(scale<0.1) scale=0.1; if(scale>2) scale=2;
 let hx = w*0.5 + halteX*scale + x*scale; let hy = h*0.45 + (halteZ*2)*scale;
 let hw = 180*scale, hh=120*scale;
 if(hy<h*0.45 || hy>h) return;
 // halte
 ctx.fillStyle='#fbbf24'; ctx.strokeStyle='black'; ctx.lineWidth=4*scale; ctx.beginPath(); ctx.roundRect(hx-hw/2,hy, hw, hh, 10*scale); ctx.fill(); ctx.stroke();
 ctx.fillStyle='black'; ctx.font=`bold ${20*scale}px sans-serif`; ctx.fillText('HALTE', hx-30*scale, hy+25*scale);
 ctx.fillText('🚌 STOP', hx-35*scale, hy+50*scale);
 // orang
 ctx.font=`${40*scale}px serif`; ctx.fillText('🧑👧👦', hx-40*scale, hy+hh+30*scale);
}

function loop(){
 if(gas) speed+=0.3; else if(brake) speed-=1.2; else speed-=0.2;
 speed=Math.max(0,Math.min(18,speed));
 if(left) x-=speed*0.8; if(right) x+=speed*0.8;
 x=Math.max(-100,Math.min(100,x));
 roadY+=speed*3; km+=speed*0.01; halteZ-=speed;

 if(halteZ<20){ halteZ=400; halteX=(Math.random()>0.5?120:-120); }
 if(halteZ>30 && halteZ<80 && Math.abs(x-halteX)<50 && speed<1){
   pass+=3; money+=15000; halteZ=400; document.getElementById('p').innerText=pass; document.getElementById('m').innerText=money;
 }

 // draw
 ctx.clearRect(0,0,canvas.width,canvas.height);
 drawRoad();
 drawHalte();
 drawBus();

 document.getElementById('s').innerText=Math.floor(speed*6);
 requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
