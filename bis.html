<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUS HD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#0f172a;display:flex;justify-content:center}
#game{width:100%;max-width:430px;height:100vh;background:#8ecae6;position:relative;overflow:hidden;box-shadow:0 0 30px black}
.header{display:flex;gap:8px;padding:8px;position:absolute;top:0;width:100%;z-index:100}
.h-btn{flex:1;padding:10px;border-radius:18px;border:3px solid #1e293b;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #1e293b}
.h-menu{background:#fbbf24} .h-pass{background:#38bdf8;color:white} .h-money{background:#a3e635}
.route{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:#6366f1;color:white;padding:6px 18px;border-radius:20px;font-size:13px;z-index:100;border:2px solid white;white-space:nowrap}
#road{position:absolute;top:100px;bottom:180px;left:0;right:0;background:#475569;display:flex}
#sideL,#sideR{width:18%;background:#bbf7d0;padding:8px}
#centerRoad{flex:1;background:#334155;position:relative;border-left:4px solid #fbbf24;border-right:4px solid #fbbf24;overflow:hidden}
#bus{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:92px;height:170px;background:linear-gradient(#fde047,#facc15);border-radius:18px 18px 10px 10px;border:4px solid #1e293b;z-index:50;box-shadow:0 8px 0 #1e293b}
#bus::before{content:'08';position:absolute;top:42px;left:50%;transform:translateX(-50%);background:#1e293b;color:#facc15;padding:2px 10px;border-radius:6px;font-size:14px}
#bus::after{content:'';position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:70px;height:36px;background:#1e293b;border-radius:6px;border:2px solid #60a5fa}
#halteArea{position:absolute;top:-180px;right:0;width:30%;height:160px;background:#fef3c7;border:4px solid #f59e0b;border-right:none;border-radius:18px 0 0 18px;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:top .1s}
#busStopSign{background:#fbbf24;padding:4px 12px;border-radius:10px;border:3px solid black;font-size:14px}
.p{font-size:28px;animation:bounce .5s infinite alternate}
@keyframes bounce{to{transform:translateY(-5px)}}
#dash{position:absolute;bottom:0;left:0;right:0;height:180px;background:#1e3a8a;border-top:6px solid white;border-radius:30px 30px 0 0;display:grid;grid-template-columns:100px 1fr 90px 90px;gap:10px;padding:16px;z-index:200}
#steer{width:90px;height:90px;background:#1e293b;border:4px solid #60a5fa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:inset 0 0 10px black}
#speedBox{background:#0f172a;border:3px solid white;border-radius:20px;padding:8px;text-align:center;color:white}
#speedVal{font-size:36px;color:#facc15}
#btn{border:4px solid #1e293b;border-radius:20px;font-size:13px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 #1e293b}
#btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1e293b}
.brake{background:#38bdf8} .gas{background:#a3e635}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fbbf24;border:4px solid black;padding:14px 24px;border-radius:20px;font-size:18px;display:none;z-index:300}
</style></head><body>
<div id="game">
<div class="header">
<button class="h-btn h-menu" onclick="location.reload()">☰ MENU</button>
<div class="h-btn h-pass">👤 <span id="pass">0</span>/20</div>
<div class="h-btn h-money">💰 $<span id="money">0</span></div>
</div>
<div class="route">ROUTE: TERMINAL → MALL • <span id="km">0</span> KM</div>

<div id="road">
<div id="sideL">🏢<br>🌳<br>🚗</div>
<div id="centerRoad">
<div id="halteArea">
<div id="busStopSign">HALTE</div>
<div style="font-size:10px">KOTA BUS STOP</div>
<div style="display:flex" id="people"></div>
</div>
<div id="bus"></div>
</div>
<div id="sideR">🏠<br>🌳</div>
</div>
<div id="msg">🛑 REM! ANGKUT!</div>

<div id="dash">
<div id="steer" ontouchstart="turn=-1" ontouchend="turn=0" onmousedown="turn=-1" onmouseup="turn=0">🎮</div>
<div id="speedBox">
<div style="font-size:12px;opacity:.7">SPEED</div>
<div id="speedVal">0</div>
<div style="font-size:14px">KM/H</div>
<div style="margin-top:6px;background:black;border-radius:10px;padding:4px;font-size:11px">⛽ <span id="fuel">100</span>%</div>
</div>
<div id="btn" class="brake" ontouchstart="isBrake=true" ontouchend="isBrake=false" onmousedown="isBrake=true" onmouseup="isBrake=false"><span style="font-size:30px">⏸️</span>BRAKE</div>
<div id="btn" class="gas" ontouchstart="isGas=true" ontouchend="isGas=false" onmousedown="isGas=true" onmouseup="isGas=false"><span style="font-size:30px">⛽</span>GAS</div>
</div>
</div>
<script>
let x=50,speed=0,turn=0,isGas=false,isBrake=false,halteTop=-180,km=0,fuel=100,pass=0,money=0,loaded=true;
let bus=document.getElementById('bus'), halte=document.getElementById('halteArea'), peopleDiv=document.getElementById('people');
let ppl=[];

function spawn(){
 ppl=[]; peopleDiv.innerHTML='';
 for(let i=0;i<3;i++){let d=document.createElement('div');d.className='p';d.innerText=['🧑','👧','👦'][i];peopleDiv.appendChild(d);ppl.push(d);}
}
spawn();

function loop(){
 if(isGas && !isBrake){speed+=0.18; fuel-=0.02;} else if(isBrake){speed-=0.5;} else speed-=0.12;
 if(speed<0)speed=0; if(speed>14)speed=14;
 if(turn===-1) x-=speed*0.6; if(turn===1) x+=speed*0.6;
 if(x<25)x=25; if(x>75)x=75;
 bus.style.left=x+'%';
 
 km+=speed*0.01; document.getElementById('km').innerText=km.toFixed(1);
 document.getElementById('speedVal').innerText=Math.floor(speed*7);
 document.getElementById('fuel').innerText=Math.floor(fuel);

 if(loaded){
   halteTop+=speed*2;
   halte.style.top=halteTop+'px';
   if(halteTop>180 && halteTop<380){
     document.getElementById('msg').style.display='block';
     document.getElementById('msg').innerText='🛑 HALTE! REM!';
     if(speed<0.8){
       // angkut
       pass+=ppl.length; money+=ppl.length*5000;
       document.getElementById('pass').innerText=pass;
       document.getElementById('money').innerText=money;
       peopleDiv.innerHTML='✅'; document.getElementById('msg').innerText='✅ '+ppl.length+' NAIK!';
       setTimeout(()=>{halteTop=-200; loaded=false; document.getElementById('msg').style.display='none'; setTimeout(()=>{loaded=true; spawn();},3000);},1200);
     }
   } else if(halteTop>600){
     halteTop=-200; loaded=true; spawn(); document.getElementById('msg').style.display='none';
   }
 }
 requestAnimationFrame(loop);
}
let steerEl=document.getElementById('steer');
steerEl.addEventListener('touchmove',e=>{let t=e.touches[0].clientX; if(t<140)turn=-1; else if(t>260)turn=1; else turn=0;});
loop();
</script>
</body></html>
