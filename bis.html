<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BUS SIMULATOR 3D PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{overflow:hidden;background:#000}
canvas{display:block}
#ui{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;gap:8px;z-index:10;max-width:500px;margin:0 auto}
.u{background:rgba(0,0,0,.75);backdrop-filter:blur(10px);color:white;border:2px solid white;border-radius:16px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 4px 0 black}
#route{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#6366f1;color:white;padding:6px 18px;border-radius:20px;border:2px solid white;z-index:10;font-size:12px}
#dash{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:170px;background:linear-gradient(#1e3a8a,#172554);border-top:5px solid white;border-radius:28px 28px 0 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px;z-index:10}
.b{border-radius:20px;border:3px solid #0f172a;box-shadow:0 6px 0 #0f172a;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.b:active{transform:translateY(4px);box-shadow:0 2px 0 #0f172a}
#steerL{background:#38bdf8} #brake{background:#ef4444;color:white} #steerR{background:#38bdf8} #gas{grid-column:span 3;background:#84cc16;height:54px;font-size:18px}
#speed{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#facc15;padding:10px 22px;border-radius:20px;border:3px solid white;z-index:10;text-align:center}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#fbbf24;border:4px solid black;padding:14px 26px;border-radius:20px;font-size:18px;z-index:20;display:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">
<button class="u" onclick="location.reload()" style="background:#fbbf24;color:black">☰ MENU</button>
<div class="u">👤 <span id="pass">0</span>/20</div>
<div class="u">💰 $<span id="money">0</span></div>
<div class="u">⛽ <span id="fuel">100</span>%</div>
</div>
<div id="route">🚌 TERMINAL → MALL | <span id="km">0.0</span> KM</div>
<div id="speed"><div style="font-size:11px;color:white">SPEED</div><div id="spd" style="font-size:32px">0</div><div style="font-size:11px">KM/H</div></div>
<div id="msg">🛑 HALTE! REM!</div>

<div id="dash">
<div id="steerL" class="b">◀<br>BELOK</div>
<div id="brake" class="b">⏸️<br>REM</div>
<div id="steerR" class="b">▶<br>BELOK</div>
<div id="gas" class="b">💨 GAS POLL - TAHAN!</div>
</div>

<script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,40,120);
let camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));
let sun=new THREE.DirectionalLight(0xffffff,1); sun.position.set(20,30,10); sun.castShadow=true; scene.add(sun);

// ROAD
let road=new THREE.Mesh(new THREE.PlaneGeometry(20,1000), new THREE.MeshStandardMaterial({color:0x334155})); road.rotation.x=-Math.PI/2; road.position.y=-1.2; road.receiveShadow=true; scene.add(road);
let line=new THREE.Mesh(new THREE.PlaneGeometry(0.5,1000), new THREE.MeshStandardMaterial({color:0xffffff})); line.rotation.x=-Math.PI/2; line.position.y=-1.15; scene.add(line);

// BUS - 3D BENERAN!
let busGroup=new THREE.Group();
let body=new THREE.Mesh(new THREE.BoxGeometry(3,2.2,7), new THREE.MeshStandardMaterial({color:0xfacc15})); body.position.y=0.5; body.castShadow=true; busGroup.add(body);
let cabin=new THREE.Mesh(new THREE.BoxGeometry(2.9,1,2), new THREE.MeshStandardMaterial({color:0x38bdf8})); cabin.position.set(0,0.8,2); busGroup.add(cabin);
let roof=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.2,5), new THREE.MeshStandardMaterial({color:0xfde047})); roof.position.y=1.7; busGroup.add(roof);
for(let z of [-2.5,2.5]){let w=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.4,16), new THREE.MeshStandardMaterial({color:0x111})); w.rotation.z=Math.PI/2; w.position.set(1.6,-0.6,z); busGroup.add(w); let w2=w.clone(); w2.position.x=-1.6; busGroup.add(w2);}
busGroup.position.set(0,0,10); scene.add(busGroup);

// BUILDINGS + HALTE
let objects=[];
function addBuilding(z,x){
 let h=5+Math.random()*10; let b=new THREE.Mesh(new THREE.BoxGeometry(4,h,4), new THREE.MeshStandardMaterial({color:Math.random()>0.5?0x94a3b8:0xbbf7d0})); b.position.set(x,h/2-1.2,z); b.castShadow=true; scene.add(b); objects.push(b);
}
for(let i=0;i<80;i++){ addBuilding(-i*12-20, 12+Math.random()*5); addBuilding(-i*12-20, -12-Math.random()*5); }

// HALTE
let halteGroup=new THREE.Group();
let halteBase=new THREE.Mesh(new THREE.BoxGeometry(4,0.2,6), new THREE.MeshStandardMaterial({color:0xfbbf24})); halteBase.position.y=-0.5; halteGroup.add(halteBase);
let halteRoof=new THREE.Mesh(new THREE.BoxGeometry(4.5,0.3,6.5), new THREE.MeshStandardMaterial({color:0xf59e0b})); halteRoof.position.y=2.5; halteGroup.add(halteRoof);
let sign=new THREE.Mesh(new THREE.BoxGeometry(0.2,1.5,0.8), new THREE.MeshStandardMaterial({color:0x1e293b})); sign.position.set(0,1,0); halteGroup.add(sign);
halteGroup.position.set(8,0,-60); scene.add(halteGroup); objects.push(halteGroup);

let peopleMeshes=[];
function spawnPeople(){
 peopleMeshes.forEach(m=>scene.remove(m)); peopleMeshes=[];
 for(let i=0;i<3;i++){let p=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.8,4,8), new THREE.MeshStandardMaterial({color:0x60a5fa})); p.position.set(8+Math.random(),0.5,-60+Math.random()*2); scene.add(p); peopleMeshes.push(p);}
}
spawnPeople();

// CONTROLS
let speed=0, steer=0, isGas=false, isBrake=false, km=0, fuel=100, pass=0, money=0;
let keys={};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});

function bind(id, on, off){
 let el=document.getElementById(id);
 el.addEventListener('touchstart',e=>{e.preventDefault(); on();}); el.addEventListener('touchend',off);
 el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bind('steerL',()=>steer=-1,()=>steer=0);
bind('steerR',()=>steer=1,()=>steer=0);
bind('brake',()=>isBrake=true,()=>isBrake=false);
bind('gas',()=>isGas=true,()=>isGas=false);

let halteZ=-60, halteDone=false;
function loop(){
 requestAnimationFrame(loop);
 if(isGas && !isBrake){speed+=0.02; fuel-=0.015;} else if(isBrake){speed-=0.06;} else speed-=0.015;
 speed=Math.max(0,Math.min(1.2,speed));
 if(steer===-1) busGroup.position.x-=speed*0.15; if(steer===1) busGroup.position.x+=speed*0.15;
 busGroup.position.x=Math.max(-6,Math.min(6,busGroup.position.x));
 busGroup.rotation.z=-steer*speed*0.3;
 busGroup.rotation.x=Math.sin(Date.now()*0.01)*speed*0.02;

 km+=speed*0.
