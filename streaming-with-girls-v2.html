*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#020617;display:flex;justify-content:center;height:100vh}
#app{width:100%;max-width:540px;height:100vh;background:#0a0a0f;display:flex;flex-direction:column}
#top{height:28px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:white;font-size:10px;border-bottom:2px solid #ff0000}
#room{display:grid;grid-template-columns:1.3fr .8fr;gap:6px;padding:6px;height:46%;background:radial-gradient(#1e1b4b,#020617)}
.mon{background:#111;border:2px solid #333;border-radius:12px;overflow:hidden;position:relative}
.monHead{height:20px;background:#1f2937;display:flex;align-items:center;padding:0 8px;font-size:8px;color:#fbbf24}
#mainContent{height:calc(100% - 20px);display:flex;align-items:center;justify-content:center;position:relative;background:#000;cursor:pointer}
#gameScreen{width:88%;aspect-ratio:16/9;background:radial-gradient(#1e293b,#000);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px;color:white;border:1px solid #333;transition:.3s}
#webcamGirls{position:absolute;bottom:6px;right:6px;width:84px;height:84px;border-radius:20px;border:3px solid #fbbf24;overflow:hidden;box-shadow:0 0 25px #fbbf24, 0 0 0 2px white;animation:goyang 2.5s ease-in-out infinite;cursor:pointer;transition:.4s;z-index:10}
#webcamGirls.full{width:92%;height:92%;bottom:4%;right:4%;border-radius:18px;animation:none;box-shadow:0 0 50px #ff69b4, 0 0 0 3px white;}
#webcamGirls img{width:100%;height:100%;object-fit:cover}
@keyframes goyang{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(1deg) scale(1.06)}}
#musicBar{height:38px;background:linear-gradient(90deg,#1e1b4b,#312e81);display:flex;align-items:center;padding:0 10px;gap:8px;border-top:1px solid #333;border-bottom:1px solid #333}
#musicBtn{width:32px;height:32px;border-radius:50%;border:0;background:#fbbf24;font-weight:900;font-size:14px}
#chatWrap{flex:1;background:#000;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;padding:6px;font-size:11px;display:flex;flex-direction:column;gap:4px;color:white}
.msg{padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.08);animation:pop .3s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.msg.sultan{background:linear-gradient(90deg,#fef3c7,#fbbf24,#f59e0b);color:black;font-weight:900;box-shadow:0 0 20px gold;border:2px solid white}
.msg.mega{background:linear-gradient(90deg,#ff00cc,#ff0066,#ffcc00);color:white;font-weight:900;box-shadow:0 0 30px #ff00cc;font-size:12px;border:2px solid white;animation:mega .5s infinite alternate}
@keyframes mega{0%{transform:scale(1)}100%{transform:scale(1.02)}}
#controls{padding:8px;background:#0a0a0f;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{padding:11px 2px;border-radius:12px;border:0;font-weight:800;font-size:10px;color:white;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.92)}
</style>
</head>
<body>
<div id="app">
<div id="top"><span>🔴 OBS - PINKYCAT V2 ULTIMATE</span><span id="timer">00:00</span><span>👁 <b id="v">15</b> | 💰 Rp <b id="m">0</b></span></div>

<div>FPS: <b>60</b></div>
<div>VIEWERS: <b id="obsV" style="color:#fbbf24">15</b></div>

<div style="margin-top:6px;background:#000;border-radius:8px;padding:4px;height:84px;overflow:hidden" id="miniChat"></div>
</div></div>
</div>

<div id="musicBar">

</div>

<div id="chatWrap"><div id="chat"></div></div>

<button class="btn" style="background:linear-gradient(90deg,#000,#ff0000);border:2px solid gold;color:gold" onclick="donateGiga()">💥 SULTAN 100JT</button>
</div>
</div>

<audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

<script>
var viewers=15,followers=0,money=0,sec=0,isFull=false;
var names=['Sultan','Mawar','Lord','Ayu','Joko','Raja Sawer','Sultan Andi'];
function $(id){return document.getElementById(id);}
function addChat(t,cls){
 var d=document.createElement('div'); d.className='msg '+(cls||''); d.innerHTML=t;
 $('chat').appendChild(d); $('miniChat').appendChild(d.cloneNode(true));
 $('chat').scrollTop=99999;
 if($('miniChat').children.length>6) $('miniChat').removeChild($('miniChat').firstChild);
}
function speakGirls(text){
 try{
   speechSynthesis.cancel();
   var u=new SpeechSynthesisUtterance(text);
   u.lang='id-ID'; u.rate=1.1; u.pitch=1.6; u.volume=1;
   var voices=speechSynthesis.getVoices();
   var girlVoice=voices.find(v=>v.name.includes('Google') && v.lang.includes('id')) || voices.find(v=>v.lang.includes('id')) || voices.find(v=>v.name.includes('Female')) || voices[0];
   if(girlVoice) u.voice=girlVoice;
   speechSynthesis.speak(u);
   $('voiceStat').innerHTML='SPEAKING...';
   setTimeout(()=>{$('voiceStat').innerHTML='ON - GIRLS'},1500);
 }catch(e){}
}
function act(type){
 var gv=Math.floor(Math.random()*25+10); viewers+=gv; followers+=Math.floor(Math.random()*7);
 $('v').innerHTML=viewers; $('obsV').innerHTML=viewers; $('follower').innerHTML=followers;
 $('gameScreen').innerHTML=type==='game'?'🎮 MAIN GAME!':type==='react'?'😂 NGAKAK!':type==='drama'?'🔥 DRAMA PARAH!':'🎁 GIVEAWAY CUS!';
 addChat('<b>'+names[Math.floor(Math.random()*7)]+':</b> GILAK STREAMER CANTIK! 😍');
 if(type==='drama') addChat('<b>Haters:</b> Cewek gamers doang! 😤');
}
function toggleFullGirls(){
 isFull=!isFull;
 var el=$('webcamGirls');
 if(isFull){el.classList.add('full'); $('gameScreen').innerHTML='💖 FULLSCREEN GIRLS MODE!'; speakGirls('Tuan, Girls jadi gede nih! Suka gak?'); addChat('💖 <b>PinkyCat: Girls Fullscreen Mode ON! Tuan suka? Ehe~</b>','sultan');}
 else{el.classList.remove('full'); $('gameScreen').innerHTML='🎙️'; addChat('💖 <b>PinkyCat: Balik ke kecil lagi ya Tuan~</b>','');}
}
function girlsTalk(){
 var talks=[
  {txt:'Ara ara Tuan Sultan, makasih udah nonton Girls~',say:'Ara ara Tuan Sultan, makasih udah nonton Girls'},
  {txt:'Tuan mau Girls joget gak? Ehe~ 😜',say:'Tuan mau Girls joget nggak? Ehe'},
  {txt:'Donasi 1 juta nya ditunggu ya Tuan~ 👑',say:'Donasi satu jutanya ditunggu ya Tuan'},
  {txt:'Girls capek nih, Tuan pijitin dong~ 💆‍♀️',say:'Girls capek nih, Tuan pijitin dong'},
  {txt:'Viewers naik terus gara-gara Tuan Sultan! 🔥',say:'Viewers naik terus gara gara Tuan Sultan'},
  {txt:'Tuan Sultan ganteng deh~ 💖',say:'Tuan Sultan ganteng deh'},
  {txt:'Mau Girls bisikin sesuatu gak Tuan? 🤫',say:'Mau Girls bisikin sesuatu nggak Tuan?'}
 ];
 var t=talks[Math.floor(Math.random()*talks.length)];
 addChat('<b>💖 PinkyCat (Girls):</b> '+t.txt,'sultan');
 speakGirls(t.say);
 try{$('sfxSultan').currentTime=0; $('sfxSultan').play();}catch(e){}
}
function donateSultan(){
 money+=1000000; $('m').innerHTML=money.toLocaleString('id-ID');
 addChat('👑💎 <b>SULTAN ASLI DONASI Rp 1.000.000!</b> "Buat PinkyCat cantik!"','sultan');
 speakGirls('Wah makasih Tuan Sultan! Satu juta! Love you!');
 try{$('sfxSultan').play();}catch(e){}
 viewers+=50; $('v').innerHTML=viewers; $('obsV').innerHTML=viewers; followers+=20; $('follower').innerHTML=followers;
}
function donateMega(){
 money+=10000000; $('m').innerHTML=money.toLocaleString('id-ID');
 addChat('💥👑💰 <b> MEGA SULTAN DONASI Rp 10.000.000! </b> "Girls nikah sama aku!" 💍','mega');
 speakGirls('Sepuluh juta! Gila Tuan Sultan kaya banget! Makasih sayang!');
 try{$('sfxMega').play();}catch(e){}

}
function donateGiga(){
 money+=100000000; $('m').innerHTML=money.toLocaleString('id-ID');
 addChat('🚀💥👑💎💰 <b> GIGA SULTAN 100 JUTA!!! </b> SERVER MELEDAK!!! "Girls jadi milik Sultan!"','mega');
 speakGirls('Seratus juta! Ya ampun Tuan Sultan! Girls jadi milik Tuan selamanya!');
 try{$('sfxMega').play();}catch(e){}
 viewers+=1000; $('v').innerHTML=viewers; $('obsV').innerHTML=viewers; followers+=500; $('follower').innerHTML=followers;
 document.body.style.animation='mega .2s 3';
 setTimeout(()=>document.body.style.animation='',600);
}
function toggleMusic(){
 var a=$('bgm'); if(a.paused){a.volume=0.4; a.play(); $('musicBtn').innerHTML='⏸️'; addChat('🎵 <b>Music ON - Lofi Girls is now playing~</b>','');}
 else{a.pause(); $('musicBtn').innerHTML='▶️';}
}
setInterval(function(){sec++; $('timer').innerHTML=Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0');},1000);

speechSynthesis.getVoices();
setTimeout(()=>speechSynthesis.getVoices(),500);
</script>
