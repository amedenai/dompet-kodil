<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Catur Mewah FIX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;display:flex;justify-content:center}
#app{width:100%;max-width:440px;padding:12px}
h1{font-family:'Cinzel',serif;text-align:center;font-size:24px;background:linear-gradient(#fef3c7,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.frame{background:linear-gradient(45deg,#fde68a,#f59e0b,#78350f,#fde68a);padding:6px;border-radius:16px;margin-top:10px;box-shadow:0 0 25px rgba(251,191,36,.6)}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:10px;overflow:hidden;touch-action:manipulation}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.sq.light{background:#fefce8} .sq.dark{background:#1e293b}
.sq.sel{background:#fde68a !important;box-shadow:inset 0 0 0 4px #f59e0b}
.sq.hint{background:#86efac !important} .sq.hint::after{content:'●';color:#16a34a;font-size:18px;position:absolute;pointer-events:none}
.sq.cap{background:#fca5a5 !important;box-shadow:inset 0 0 0 4px #ef4444}
.p{font-size:38px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px black)} 
.p.w{color:#fbbf24;text-shadow:0 0 0 black, 0 2px 0 #78350f, 0 0 12px #fbbf24}
.p.b{color:#e2e8f0;text-shadow:0 0 0 black, 0 0 8px #38bdf8}
#info{background:#1e293b;border:2px solid #f59e0b;border-radius:14px;padding:10px;margin-top:12px;color:white;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.btn{padding:12px;border-radius:12px;border:3px solid black;font-weight:800;flex:1}
</style>
</head>
<body>
<div id="app">
<h1>♔ CATUR SULTAN ♛</h1>
<p style="text-align:center;color:#fbbf24;font-size:10px;letter-spacing:3px">GOLD MARBLE - FIX GERAK</p>
<div class="frame"><div id="board"></div></div>
<div id="info"><span id="turn">PUTIH JALAN</span><span id="msg">Klik bidak putih</span><span id="score">$0</span></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn" style="background:#38bdf8" onclick="undo()">↩️ UNDO</button>
<button class="btn" style="background:#fbbf24" onclick="showHint()">💡 HINT</button>
<button class="btn" style="background:#a3e635" onclick="newGame()">🔄 BARU</button>
<button class="btn" style="background:#ef4444;color:white" onclick="toggleBot()" id="botBtn">🤖 BOT:ON</button>
</div>
<div style="margin-top:8px;color:#94a3b8;font-size:11px;text-align:center">Klik bidak → kotak HIJAU jalan → MERAH makan</div>
</div>
<script>
let boardEl=document.getElementById('board');
let turn='w', sel=null, moves=[], hist=[], mode='bot';
let init=[
['r','n','b','q','k','b','n','r'],
['p','p','p','p','p','p','p','p'],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['','','','','','','',''],
['P','P','P','P','P','P','P','P'],
['R','N','B','Q','K','B','N','R']
];
let board=JSON.parse(JSON.stringify(init));
const ico={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

function isWhite(p){return p && p===p.toUpperCase();}
function inBoard(r,c){return r>=0&&r<8&&c>=0&&c<8;}

function getMoves(r,c){
 let p=board[r][c]; if(!p) return []; let m=[], w=isWhite(p), t=p.toLowerCase();
 let add=(nr,nc)=>{
  if(!inBoard(nr,nc)) return false;
  let q=board[nr][nc];
  if(!q){m.push({r:nr,c:nc}); return true;}
  if(isWhite(q)!==w){m.push({r:nr,c:nc}); return false;}
  return false;
 };
 if(t==='p'){
  let dir=w?-1:1, start=w?6:1;
  if(inBoard(r+dir,c) && !board[r+dir][c]){m.push({r:r+dir,c:c}); if(r===start && !board[r+dir*2][c]) m.push({r:r+dir*2,c:c});}
  for(let dc of [-1,1]){let nr=r+dir,nc=c+dc; if(inBoard(nr,nc) && board[nr][nc] && isWhite(board[nr][nc])!==w) m.push({r:nr,c:nc});}
 }
 if(t==='r'||t==='q'){for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) for(let k=1;k<8;k++) if(!add(r+dr*k,c+dc*k)) break;}
 if(t==='b'||t==='q'){for(let [dr,dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]) for(let k=1;k<8;k++) if(!add(r+dr*k,c+dc*k)) break;}
 if(t==='n'){for(let [dr,dc] of [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]) add(r+dr,c+dc);}
 if(t==='k'){for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) add(r+dr,c+dc);}
 return m;
}

function render(){
 boardEl.innerHTML='';
 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   let d=document.createElement('div');
   d.className='sq '+((r+c)%2?'dark':'light');
   if(sel && sel.r===r && sel.c===c) d.classList.add('sel');
   if(moves.some(x=>x.r===r&&x.c===c)){
    d.classList.add(board[r][c]?'cap':'hint');
   }
   let p=board[r][c];
   if(p){
    let s=document.createElement('div');
    s.className='p '+(isWhite(p)?'w':'b');
