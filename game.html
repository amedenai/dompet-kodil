<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KODIL HD 4K</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}body{background:linear-gradient(180deg,#3aa0ff,#0a3a9e);height:100vh;overflow:hidden;color:white}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}.hidden{display:none!important}#menu{background:radial-gradient(circle at 50% 0%,#5ab2ff,#1a6bff 60%,#0a3a9e)}.logo-hd{width:220px;height:220px;border-radius:40px;box-shadow:0 15px 40px rgba(0,0,0,.4),0 0 0 6px rgba(255,255,255,.2);animation:float 2s infinite;object-fit:cover;background:white}@keyframes float{50%{transform:translateY(-10px)}}.logo-text{font-size:38px;text-align:center;text-shadow:0 4px 0 #0a3a9e;font-weight:900;line-height:.9;margin-top:12px}.menu-card{background:white;border-radius:28px;padding:22px;width:100%;max-width:360px;margin-top:16px;box-shadow:0 20px 40px rgba(0,0,0,.3)}.btn{display:block;width:100%;padding:16px;border:none;border-radius:18px;font-size:19px;font-weight:900;margin-bottom:12px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2)}.btn:active{transform:translateY(5px)}.btn-primary{background:linear-gradient(180deg,#ffe27a,#ffbe2e);color:#1a3a8a}.btn-blue{background:linear-gradient(180deg,#3a8bff,#1e5eff);color:white}.btn-dark{background:#0a2a6e;color:white}.stats{display:flex;gap:8px;justify-content:center;margin:14px 0}.stat{background:rgba(255,255,255,.18);padding:8px 14px;border-radius:20px;font-size:13px;border:1px solid rgba(255,255,255,.3);font-weight:700}#gameScreen{padding:0}.topbar{display:flex;justify-content:space-between;padding:12px 15px;width:100%;background:rgba(0,0,0,.15);font-weight:700}#gameArea{flex:1;width:92%;max-width:420px;background:radial-gradient(circle at 50% 20%,#e6f0ff,white);border-radius:28px;position:relative;overflow:hidden;margin:12px auto;box-shadow:0 20px 40px rgba(0,0,0,.3)}#kodil{position:absolute;bottom:12px;left:160px;width:75px;height:75px;border-radius:20px;z-index:5;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,.3)}#koin,#bom{position:absolute;top:-80px;font-size:55px}.controls{padding:10px 15px 25px;display:flex;gap:12px;width:100%;max-width:420px}.controls button{flex:1;padding:18px}</style></head><body>
<div id="menu" class="screen"><img src="IMG-20261021-WA6861.jpg" class="logo-hd"><div class="logo-text">GAME KODIL<br>TANGKAP KOIN</div><div style="background:gold;color:#0a3a9e;padding:4px 12px;border-radius:10px;font-size:12px;font-weight:900;margin-top:6px">✨ HD 4K EDITION ✨</div><div class="stats"><div class="stat">🏆 <span id="mBest">0</span></div><div class="stat">💰 <span id="mCoin">0</span></div><div class="stat">LVL <span id="mLevel">1</span></div></div><div class="menu-card"><button class="btn btn-primary" onclick="startGame()">▶️ MAIN SEKARANG</button><button class="btn btn-blue" onclick="alert('Level unlock otomatis Tuan! Main terus!')">🗺️ LEVEL 1-9</button><button class="btn btn-dark" onclick="document.documentElement.requestFullscreen()">⛶ FULL SCREEN 4K</button></div></div>
<div id="gameScreen" class="screen hidden"><div class="topbar"><div>❤️ <span id="lives">3</span> | <span id="score">0</span></div><div>LVL <span id="lvl">1</span></div><button onclick="pauseGame()" style="background:rgba(255,255,255,.2);border:none;padding:6px 12px;border-radius:10px;color:white;font-weight:900">⏸️</button></div><div id="gameArea"><div id="koin">🪙</div><div id="bom" class="hidden">💣</div><img id="kodil" src="IMG-20261021-WA6861.jpg"></div><div class="controls"><button class="btn btn-blue" onclick="geser(-70)">◀</button><button class="btn btn-blue" onclick="geser(70)">▶</button></div></div>
<div id="overScreen" class="screen hidden" style="background:radial-gradient(circle,#ff5a7a,#c70036)"><h1>GAME OVER</h1><div class="menu-card" style="text-align:center;color:#1a3a8a"><div style="font-size:48px;font-weight:900" id="finalScore">0</div><button class="btn btn-primary" style="margin-top:15px" onclick="startGame()">🔄 MAIN LAGI</button><button class="btn btn-dark" onclick="location.reload()">🏠 MENU HD</button><button class="btn btn-blue" onclick="shareScore()">📤 BAGIKAN</button></div></div>
<script>
let best=parseInt(localStorage.getItem('kodilBest')||0),totalCoin=parseInt(localStorage.getItem('kodilCoin')||0),score=0,lives=3,xKodil=160,xKoin=100,yKoin=-80,xBom=200,yBom=-300,speed=4,isPlaying=false,gameLoopId;
document.getElementById('mBest').innerText=best;document.getElementById('mCoin').innerText=totalCoin;
function startGame(){score=0;lives=3;speed=4;document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById('gameScreen').classList.remove('hidden');document.getElementById('score').innerText=0;document.getElementById('lives').innerText=lives;isPlaying=true;loop()}
function pauseGame(){isPlaying=false;alert('Pause Tuan')}
function geser(d){xKodil+=d;if(xKodil<0)xKodil=0;if(xKodil>340)xKodil=340;document.getElementById('kodil').style.left=xKodil+'px'}
function shareScore(){let t=`👑 GW MAIN GAME KODIL HD 4K! Skor ${score}! Lu coba 😼👉 https://amedenai.github.io/dompet-kodil/game.html`;if(navigator.share)navigator.share({text:t});else prompt('Copy:',t)}
function loop(){if(!isPlaying)return; yKoin+=speed; yBom+=speed*0.9; if(yKoin>500){yKoin=-80;xKoin=Math.random()*320} if(yBom>550){yBom=-400;xBom=Math.random()*320;if(Math.random()<0.4)document.getElementById('bom').classList.remove('hidden')} if(yKoin>380 && Math.abs(xKoin-xKodil)<55){score++;totalCoin++;localStorage.setItem('kodilCoin',totalCoin);if(score>best){best=score;localStorage.setItem('kodilBest',best)}document.getElementById('score').innerText=score;yKoin=-80;xKoin=Math.random()*320;speed+=0.15} if(yBom>380 && Math.abs(xBom-xKodil)<55){lives--;document.getElementById('lives').innerText=lives;document.getElementById('bom').classList.add('hidden');yBom=-500;if(lives<=0){gameOver();return}} document.getElementById('koin').style.top=yKoin+'px';document.getElementById('koin').style.left=xKoin+'px';document.getElementById('bom').style.top=yBom+'px';document.getElementById('bom').style.left=xBom+'px';gameLoopId=requestAnimationFrame(loop)}
function gameOver(){isPlaying=false;document.getElementById('finalScore').innerText=score;document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById('overScreen').classList.remove('hidden')}
</script></body></html>
