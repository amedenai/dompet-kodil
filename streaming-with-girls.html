<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE WITH GIRLS - PinkyCat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#020617;display:flex;justify-content:center;height:100vh}
#app{width:100%;max-width:540px;height:100vh;background:#0a0a0f;display:flex;flex-direction:column}
#top{height:28px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:white;font-size:10px;border-bottom:2px solid #ff0000}
#room{display:grid;grid-template-columns:1.3fr .8fr;gap:6px;padding:6px;height:42%;background:radial-gradient(#1e1b4b,#020617)}
.mon{background:#111;border:2px solid #333;border-radius:12px;overflow:hidden;position:relative}
.monHead{height:20px;background:#1f2937;display:flex;align-items:center;padding:0 8px;font-size:8px;color:#fbbf24}
#mainContent{height:calc(100% - 20px);display:flex;align-items:center;justify-content:center;position:relative;background:#000}
#gameScreen{width:88%;aspect-ratio:16/9;background:radial-gradient(#1e293b,#000);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px;color:white;border:1px solid #333}
#webcamGirls{position:absolute;bottom:6px;right:6px;width:76px;height:76px;border-radius:16px;border:3px solid #fbbf24;overflow:hidden;box-shadow:0 0 20px #fbbf24,0 0 0 2px white;animation:goyang 3s ease-in-out infinite}
#webcamGirls img{width:100%;height:100%;object-fit:cover}
@keyframes goyang{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(1deg) scale(1.05)}}
#musicBar{height:36px;background:linear-gradient(90deg,#1e1b4b,#312e81);display:flex;align-items:center;padding:0 10px;gap:8px;border-top:1px solid #333;border-bottom:1px solid #333}
#musicBtn{width:30px;height:30px;border-radius:50%;border:0;background:#fbbf24;font-weight:900}
#chatWrap{flex:1;background:#000;display:flex;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;padding:6px;font-size:11px;display:flex;flex-direction:column;gap:4px;color:white}
.msg{padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.08)}
.msg.sultan{background:linear-gradient(90deg,#fef3c7,#f59e0b);color:black;font-weight:900;box-shadow:0 0 15px gold}
#controls{padding:8px;background:#0a0a0f;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.btn{padding:10px 2px;border-radius:10px;border:0;font-weight:800;font-size:10px;color:white}
</style>
</head>
<body>
<div id="app">
<div id="top"><span>🔴 OBS - PINKYCAT LIVE</span><span id="timer">00:00</span><span>👁 <b id="v">15</b> | 💰 Rp <b id="m">0</b></span></div>
<div id="room">
<div class="mon"><div class="monHead">🎮 GAME CAPTURE</div><div id="mainContent">
<div id="gameScreen">🎙️</div>
<div id="webcamGirls"><img src="IMG-20261021-WA0461.jpg" alt="Girls"></div>
</div></div>
<div class="mon"><div class="monHead">📊 OBS STATS</div><div style="padding:6px;color:white;font-size:9px">
<div>BITRATE: <b style="color:#fbbf24">6000 kbps</b></div>
<div>FPS: <b>60</b></div>
<div>VIEWERS: <b id="obsV" style="color:#fbbf24">15</b></div>
<div style="margin-top:6px;background:#000;border-radius:6px;padding:4px;height:80px;overflow:hidden" id="miniChat"></div>
</div></div>
</div>
<div id="musicBar">
<button id="musicBtn" onclick="toggleMusic()">▶️</button>
<div style="color:white;font-size:10px;flex:1"><b>🎵 Lofi - Girls is streaming with you~ 💖</b></div>
<div style="color:white;font-size:10px">💎 <b id="follower">0</b> followers</div>
</div>
<div id="chatWrap"><div id="chat"></div></div>
<div id="controls">
<button class="btn" style="background:#38bdf8" onclick="act('game')">🎮 GAME</button>
<button class="btn" style="background:#fbbf24;color:#713f12" onclick="act('react')">😂 REACT</button>
<button class="btn" style="background:#a78bfa" onclick="act('drama')">🔥 DRAMA</button>
<button class="btn" style="background:#4ade80" onclick="act('giveaway')">🎁 GIVEAWAY</button>
<button class="btn" style="background:#1e293b" onclick="act('rest')">😴 REST</button>
<button class="btn" style="background:#fde68a;color:#78350f" onclick="girlsTalk()">💖 GIRLS TALK</button>
<button class="btn" style="background:#f87171" onclick="donateSultan()">💎 SULTAN 1JT</button>
<button class="btn" style="background:#818cf8" onclick="toggleMusic()">🎵 MUSIC</button>
</div>
</div>
<audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>
<audio id="sfxSultan" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2d79daf5d7.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<script>
var viewers=15,followers=0,money=0,sec=0; var names=['Sultan','Mawar','Lord','Ayu','Joko'];
function $(id){return document.getElementById(id);}
function addChat(t,cls){
 var d=document.createElement('div'); d.className='msg '+(cls||''); d.innerHTML=t;
 $('chat').appendChild(d); $('miniChat').appendChild(d.cloneNode(true));
 $('chat').scrollTop=$('chat').scrollHeight;
 if($('miniChat').children.length>6) $('miniChat').removeChild($('miniChat').firstChild);
}
function act(type){
 var gv=Math.floor(Math.random()*20+5); viewers+=gv; followers+=Math.floor(Math.random()*5);
 $('v').innerHTML=viewers; $('obsV').innerHTML=viewers; $('follower').innerHTML=followers;
 $('gameScreen').innerHTML=type==='game'?'🎮':type==='react'?'😂':type==='drama'?'🔥':'🎁';
 addChat('<b>'+names[Math.floor(Math.random()*5)]+':</b> GILAK STREAMER CANTIK! 😍');
}
function girlsTalk(){
 var talks=['Ara ara Tuan Sultan~ makasih udah nonton Girls~ 💖','Tuan mau Girls joget gak? Ehe~ 😜','Donasi 1 juta nya ditunggu ya Tuan~ 👑','Girls capek nih, Tuan pijitin dong~','Viewers naik terus gara-gara Tuan Sultan!'];
 var t=talks[Math.floor(Math.random()*talks.length)];
 addChat('<b>💖 PinkyCat (Girls):</b> '+t,'sultan');
 try{$('sfxSultan').currentTime=0; $('sfxSultan').play();}catch(e){}
}
function donateSultan(){
 money+=1000000; $('m').innerHTML=money.toLocaleString('id-ID');
 addChat('👑💎 <b>SULTAN ASLI DONASI Rp 1.000.000!</b> "Buat PinkyCat cantik!"','sultan');
 girlsTalk();
 try{$('sfxSultan').play();}catch(e){}
 viewers+=50; $('v').innerHTML=viewers;
}
function toggleMusic(){
 var a=$('bgm'); if(a.paused){a.volume=0.4; a.play(); $('musicBtn').innerHTML='⏸️'; addChat('🎵 <b>Music ON - Lofi Girls is now playing~</b>','');}
 else{a.pause(); $('musicBtn').innerHTML='▶️';}
}
setInterval(function(){sec++; $('timer').innerHTML=Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0');},1000);
addChat('🔴 <b>PINKYCAT LIVE STARTED! Girls is here~ 💖</b>','sultan');
</script>
</body>
</html>
